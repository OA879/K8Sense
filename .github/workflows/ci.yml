# K8sense CI — a lean, purpose-built pipeline that runs exactly what we can
# guarantee green, replacing the ~24 inherited Headlamp-org workflows (which
# were entangled with Headlamp's private registries, plugin-test images, chart
# publishing, exotic-arch matrices and strict linters, and could never pass on
# this fork).
#
# Scope on purpose:
#   - backend: compile everything, vet + test the K8sense (clusterdoctor) code.
#     The Postgres integration test self-skips without K8SENSE_TEST_PG_DSN.
#   - frontend: type-check + production build.
# The desktop installers are built separately by release.yml on version tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.*'
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./pkg/clusterdoctor/...
      - name: Test (Cluster Doctor)
        working-directory: backend
        run: go test -race ./pkg/clusterdoctor/...

  frontend:
    name: Frontend (type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        working-directory: frontend
        run: npm run build
